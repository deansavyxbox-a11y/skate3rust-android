plugins { id 'com.android.application' }
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250107'
}
android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'com.skate3rust.android'
    compileSdk 35
    defaultConfig {
        applicationId 'com.skate3rust.android'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-experimental'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes { debug { debuggable true; jniDebuggable true } }
    packaging { jniLibs { useLegacyPackaging true } }
}
tasks.register('buildRust', Exec) {
    workingDir rootProject.projectDir
    commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'build-rust.ps1', '-Profile', providers.gradleProperty('skateRustProfile').getOrElse('release')
}
tasks.named('preBuild').configure { dependsOn 'buildRust' }

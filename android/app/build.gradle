plugins { id 'com.android.application'; id 'com.chaquo.python' }
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250107'
}
android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'com.skate3rust.android'
    compileSdk 35
    defaultConfig {
        applicationId 'com.skate3rust.android'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.2.0-rc4'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes { debug { debuggable true; jniDebuggable true } }
    packaging { jniLibs { useLegacyPackaging true } }
    sourceSets { main.assets.srcDir layout.buildDirectory.dir('generated/python-assets') }
}
chaquopy {
    defaultConfig {
        version = '3.13'
        buildPython 'py.exe', '-3.13'
        pip {
            install 'numpy==1.26.2'
            install 'Pillow==11.0.0'
        }
    }
    sourceSets { main { srcDir layout.buildDirectory.dir('generated/python') } }
}
tasks.register('prepareAndroidPython', Exec) {
    workingDir rootProject.projectDir
    commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'copy-android-python.ps1',
            '-SourceRoot', rootProject.projectDir.parentFile, '-OutputRoot', layout.buildDirectory.dir('generated/python').get().asFile,
            '-AssetsRoot', layout.buildDirectory.dir('generated/python-assets/android-python').get().asFile
}
tasks.configureEach { task ->
    if (task.name.endsWith('PythonSources') || task.name.endsWith('Assets')) {
        task.dependsOn tasks.named('prepareAndroidPython')
    }
}
tasks.register('buildRust', Exec) {
    workingDir rootProject.projectDir
    commandLine 'powershell.exe', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'build-rust.ps1', '-Profile', providers.gradleProperty('skateRustProfile').getOrElse('release')
}
tasks.named('preBuild').configure { dependsOn 'buildRust', 'prepareAndroidPython' }

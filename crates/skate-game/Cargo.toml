[package]
name = "skate-game"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "skate3rust"
path = "src/main.rs"

[[bin]]
name = "skate3-multiplayer"
path = "src/multiplayer_main.rs"
test = false

[[bin]]
name = "skate3-custom-models"
path = "src/custom_models_main.rs"
test = false

[features]
default = ["dev-dynamic"]
dev-dynamic = ["bevy/dynamic_linking"]

[dependencies]
bevy = { workspace = true, features = ["jpeg", "trace", "debug", "bevy_audio", "wav"] }
skate-core.workspace = true
skate-data.workspace = true
half = "=2.7.1"
serde_json.workspace = true
serde.workspace = true
    skate-net = { path = "../skate-net" }
blake3 = "=1.8.7"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
skate-mods = { path = "../skate-mods" }
skate-dynamics = { path = "../skate-dynamics" }
gltf = { version = "=1.4.1", default-features = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
bevy = { workspace = true, default-features = true }

[target.'cfg(target_os = "android")'.dependencies]
bevy = { workspace = true, features = ["std", "async_executor", "multi_threaded", "android-native-activity", "default_app", "3d_bevy_render", "2d_bevy_render", "ui_bevy_render", "bevy_scene", "bevy_animation", "bevy_winit", "bevy_picking", "default_font", "png", "vorbis"] }

[dev-dependencies]
naga = { version = "=27.0.3", features = ["wgsl-in"] }
naga_oil = { version = "=0.20.0", default-features = false }
wgpu = { version = "=27.0.1", default-features = false, features = ["vulkan", "naga-ir"] }
